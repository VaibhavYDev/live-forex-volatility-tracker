[project]
name = "fx-platform"
version = "0.1.0"
description = "Shared infrastructure adapters: structured logging, Redis factory, metrics server."
requires-python = ">=3.11"
dependencies = [
    "redis[hiredis]>=5.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_platform"]
