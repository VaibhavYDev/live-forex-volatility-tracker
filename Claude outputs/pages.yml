# Publishes the dashboard to GitHub Pages.
#
# The published build talks to no backend: `scripts/build_demo_dataset.py` runs
# the real fx_core engine and bakes what it produced into the bundle, so the
# page needs no ingestor, no Redis and no API. That is the whole point — a link
# that answers at 3am with nothing running anywhere.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one in flight: a half-finished
# deployment is a broken public link.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core package
        # Only fx_core is needed — the dataset builder imports the estimators,
        # the detector and the interval fold, none of which touch Redis.
        run: pip install -e packages/core

      - name: Rebuild the dataset and check it matches what is committed
        # The generator is deterministic, so this is a free consistency check:
        # if the engine's output has moved, the committed dataset is stale and
        # the diff says exactly which numbers changed.
        run: |
          python scripts/build_demo_dataset.py apps/web/src/demo/dataset.json
          git diff --exit-code --stat apps/web/src/demo/dataset.json \
            || { echo "::error::dataset.json is stale — run 'make demo-data' and commit"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        working-directory: apps/web

      - name: Build
        working-directory: apps/web
        env:
          VITE_DEMO: "1"
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build

      - name: SPA fallback
        # Pages has no rewrite rules, so a deep link would 404. Serving index.html
        # as the 404 page is the standard way to hand routing back to the app.
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
