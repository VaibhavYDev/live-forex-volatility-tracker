[project]
name = "fx-worker"
version = "0.1.0"
description = "Drains the Redis tick WAL into PostgreSQL/TimescaleDB. At-least-once in, exactly-once effect out."
requires-python = ">=3.11"
dependencies = [
    "fx-core",
    "fx-platform",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[project.scripts]
fx-worker = "fx_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_worker"]

[tool.uv.sources]
fx-core = { workspace = true }
fx-platform = { workspace = true }
