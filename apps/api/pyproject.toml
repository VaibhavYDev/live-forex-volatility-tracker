[project]
name = "fx-api"
version = "0.1.0"
description = "Stateless FastAPI gateway: REST history + conflating WebSocket fan-out."
requires-python = ">=3.11"
dependencies = [
    "fx-core",
    "fx-platform",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_api"]

[tool.uv.sources]
fx-core = { workspace = true }
fx-platform = { workspace = true }
