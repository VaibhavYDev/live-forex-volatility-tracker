[project]
name = "fx-ingestor"
version = "0.1.0"
description = "Leader-elected upstream ingestor. Owns the ONE connection to the provider."
requires-python = ">=3.11"
dependencies = [
    "fx-core",
    "fx-platform",
    "redis[hiredis]>=5.0",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[project.scripts]
fx-ingestor = "fx_ingestor.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_ingestor"]

[tool.uv.sources]
fx-core = { workspace = true }
fx-platform = { workspace = true }
