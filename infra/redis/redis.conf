# =============================================================================
# Redis configuration — the eviction policy is the interesting part.
#
# THE MISTAKE THIS AVOIDS
# -----------------------
# `maxmemory-policy` is a SERVER-level directive. Logical databases (`SELECT 1`)
# do NOT get separate policies — a very common misconception. And under
# `allkeys-lru`, Redis can evict a whole stream key at once: it does not politely
# trim your write-ahead log, it DELETES it, along with every unacknowledged tick
# the persister had not yet written to Postgres. Silent, unrecoverable data loss
# with no error anywhere.
#
# THE INVARIANT
# -------------
#     Keys WITHOUT a TTL are durable.  Keys WITH a TTL are disposable.
#
# `volatile-lru` only evicts keys that carry a TTL, so:
#
#   stream:ticks           no TTL  ->  structurally immune to eviction
#   lock:ingestor:leader   PX TTL  ->  self-expiring by design (see note below)
#   q:*, bar:*, vol:*      TTL     ->  evictable cache, correctly disposable
#
# The invariant is enforced by tests/unit/test_resilience.py::TestRedisKeyInvariant
# and by an integration test that asserts the real TTLs against a live Redis.
#
# (The leader lease does carry a TTL and is therefore technically evictable. That
# is harmless: losing the lease key means the next standby acquires it, which is
# exactly the failover path — and it is a 40-byte key that LRU will never choose
# ahead of megabytes of quote cache.)
#
# AT SCALE
# --------
# The production posture is two instances: `noeviction` for the WAL, `allkeys-lru`
# for the cache. One instance with `volatile-lru` is the right call for a project
# this size — see docs/adr/0002-redis-eviction-policy.md.
# =============================================================================

maxmemory 512mb
maxmemory-policy volatile-lru

# Once memory is exhausted and nothing evictable remains, writes fail loudly with
# an OOM error. That is CORRECT: it is backpressure. The ingestor catches it and
# stops reading from the upstream socket rather than dropping ticks on the floor.
maxmemory-samples 5

# Durability: the WAL is a 15-minute buffer, not a system of record — Postgres is.
# AOF everysec bounds worst-case loss at ~1s of ticks, for a fraction of the write
# amplification of `always`. RDB snapshots are redundant on top of that.
appendonly yes
appendfsync everysec
save ""

# Streams: entries are packed into macro-nodes, and `XADD ... MINID ~` only drops
# WHOLE nodes. That is precisely what keeps trimming O(1) amortised instead of
# O(n) per write. Smaller nodes = finer-grained (more accurate) trimming at
# slightly higher overhead; 100 is a reasonable middle.
stream-node-max-entries 100

# A slow client that cannot drain its pub/sub buffer gets disconnected rather than
# growing the server's memory without bound. The application-level conflation in
# fx_api/ws/conflator.py handles slow *browsers*; this handles a slow *replica*.
client-output-buffer-limit pubsub 32mb 8mb 60

timeout 0
tcp-keepalive 300
appendfilename "fx.aof"
dir /data
