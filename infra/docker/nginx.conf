# Per-visitor limits, so one browser tab in a loop or one script cannot take the
# API or the socket fan-out away from everyone else. A dashboard page load makes a
# few dozen /api requests and holds one socket; these leave ample room for that.
limit_req_zone $binary_remote_addr zone=fx_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=fx_ws:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The visitor's address. Behind the TLS terminator every connection comes from
    # its container, so the limits above would lump all visitors together; Caddy
    # sets X-Forwarded-For to the real client and discards any value the client
    # sent, so it is trusted from private addresses (the compose network) only.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the API per request through Docker's DNS. A literal `proxy_pass
    # http://api:8000` is resolved once at startup, so recreating the api
    # container (new address) turned every /api and /ws request into a 502 until
    # web was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Hashed asset filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the INDEX: it names the hashed bundles above. Caching it is
    # the one thing that must never happen here, because the two rules combine
    # into a trap - a browser holding a stale index.html asks for an asset
    # filename that no longer exists after a redeploy, and `immutable` means it
    # will not revalidate. The visitor gets a blank page, the server logs a
    # single 404, and a hard refresh "mysteriously fixes it".
    #
    # Cheap to serve uncached: it is 0.4 kB and the assets it points at are
    # still cached for a year.
    # `expires` is deliberately NOT used here: it emits its own Cache-Control,
    # and combined with add_header the response carries two of them.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback. try_files' internal redirect re-enters the location above,
    # so deep links get the no-cache header too.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=fx_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket proxying needs the Upgrade dance AND a long read timeout.
    # nginx's default proxy_read_timeout is 60s, which silently kills any idle
    # WebSocket after a minute — a classic "it works locally but drops in
    # production every 60 seconds" bug.
    location /ws/ {
        limit_conn fx_ws 8;
        limit_conn_status 429;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
