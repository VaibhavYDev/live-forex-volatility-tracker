server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the INDEX: it names the hashed bundles above. Caching it is
    # the one thing that must never happen here, because the two rules combine
    # into a trap - a browser holding a stale index.html asks for an asset
    # filename that no longer exists after a redeploy, and `immutable` means it
    # will not revalidate. The visitor gets a blank page, the server logs a
    # single 404, and a hard refresh "mysteriously fixes it".
    #
    # Cheap to serve uncached: it is 0.4 kB and the assets it points at are
    # still cached for a year.
    # `expires` is deliberately NOT used here: it emits its own Cache-Control,
    # and combined with add_header the response carries two of them.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback. try_files' internal redirect re-enters the location above,
    # so deep links get the no-cache header too.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket proxying needs the Upgrade dance AND a long read timeout.
    # nginx's default proxy_read_timeout is 60s, which silently kills any idle
    # WebSocket after a minute — a classic "it works locally but drops in
    # production every 60 seconds" bug.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
