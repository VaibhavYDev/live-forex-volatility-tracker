[project]
name = "forex-volatility-tracker"
version = "0.1.0"
description = "Fault-tolerant live FX volatility tracker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fx-core",
    "fx-platform",
    "fx-api",
    "fx-ingestor",
    "fx-worker",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    "anyio>=4.14.2",
    "pytest-timeout>=2.4.0",
    "numpy>=2.4.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/platform", "apps/api", "apps/ingestor", "apps/worker"]

[tool.uv.sources]
fx-core = { workspace = true }
fx-platform = { workspace = true }
fx-api = { workspace = true }
fx-ingestor = { workspace = true }
fx-worker = { workspace = true }

# ---------------------------------------------------------------- tooling ----

[tool.ruff]
target-version = "py311"
line-length = 100
# Markdown is excluded because ruff 0.16 began formatting fenced Python blocks in
# prose by default (0.15 kept it behind preview), and it reformatted the class
# sketches in ARCHITECTURE.md — collapsing column-aligned trailing comments that
# are there to make the shape of a structure readable at a glance.
#
# Those snippets are illustrations, not compiled source. Letting a code formatter
# rewrite them trades documentation quality for nothing, and it means a routine
# lockfile bump can turn the build red with no change to the code. The formatter's
# jurisdiction is the codebase.
extend-exclude = ["apps/web", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async antipatterns  <-- catches blocking calls in coroutines
    "PL",       # pylint subset
]
ignore = [
    # Explicit config objects legitimately take many arguments; the alternative
    # is a dict, which is strictly worse for type checking.
    "PLR0913",
    "PLR0917",
    # FastAPI REQUIRES Query()/Depends() in argument defaults. This rule is a
    # true positive for ordinary Python and a false positive for FastAPI.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]  # magic numbers and asserts ARE the test
# A state machine with one branch per state legitimately has many returns.
"packages/core/fx_core/alerts/hysteresis.py" = ["PLR0911"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
exclude = ["apps/web"]
mypy_path = "packages/core:packages/platform:apps/api:apps/ingestor:apps/worker"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not load\""  # benchmarks are opt-in: uv run pytest tests/load -m load -s
markers = [
    "integration: requires real Redis/Postgres (testcontainers)",
    "chaos: fault-injection tests",
    "load: throughput/latency benchmarks",
]

[tool.coverage.run]
# All four packages, not just the maths core. Scoping this to fx_core reported
# 88% while describing 35% of the Python - and a number that only measures the
# easiest third improves as the untested part grows, which is backwards. The
# honest figure across everything is ~64%.
source = [
    "packages/core/fx_core",
    "apps/api/fx_api",
    "apps/ingestor/fx_ingestor",
    "apps/worker/fx_worker",
]

[tool.coverage.report]
# A ratchet, not a target. Raise it when the number goes up; never lower it to
# make a build pass.
fail_under = 60
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
