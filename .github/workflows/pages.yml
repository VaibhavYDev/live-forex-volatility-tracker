# Publishes the dashboard to GitHub Pages.
#
# This deploys docs/ exactly as committed and builds nothing, which is
# deliberate. The published link has one requirement — that it answers, every
# time, for anyone — and a workflow that installs Python, installs npm and runs
# a bundler has three ways to fail that have nothing to do with Pages. Each of
# them would take the public link down while a working, already-tested bundle
# sat in the repo untouched.
#
# Freshness is CI's problem instead: the `demo` job there rebuilds docs/ from
# source and fails if the committed copy has drifted. A stale demo should break
# a pull request, not the live site.
#
# The bundle is a single self-contained file with no external requests, so it
# serves correctly whether Pages is configured for /docs on a branch, for the
# repository root, or through this workflow — and survives the repo being
# renamed. scripts/verify_demo.mjs proves that against each of those shapes.
name: pages

on:
  push:
    branches: [main]
  # Recovery hatch. The first deploy after Pages is switched on needs to happen
  # without waiting for an unrelated commit, and re-running from the Actions tab
  # is faster to explain than an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one in flight: a half-finished
# deployment is a broken public link.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
