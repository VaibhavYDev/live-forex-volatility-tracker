name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    # The load suite asserts the O(1) property, and an O(n) regression passes
    # every functional test while degrading only after hours of uptime. Nightly
    # rather than per-push because it takes minutes, not seconds.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: fx
          POSTGRES_PASSWORD: fx
          POSTGRES_DB: fx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fx" --health-interval 5s
          --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --all-packages --frozen

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check . --output-format=github
      - name: Types (strict)
        run: uv run mypy packages apps

      - name: Apply schema
        env: {PGPASSWORD: fx}
        run: |
          # The image tag is `latest-pg16`, a moving target — the extension version
          # underneath changes without a commit here, and its API has changed
          # across releases. Print what we actually got, so a migration that stops
          # applying can be read against a version instead of guessed at.
          psql -h localhost -U fx -d fx -tAc \
            "SELECT 'timescaledb ' || default_version FROM pg_available_extensions WHERE name = 'timescaledb'"
          psql -h localhost -U fx -d fx -v ON_ERROR_STOP=1 -f infra/migrations/001_init.sql
          psql -h localhost -U fx -d fx -v ON_ERROR_STOP=1 -f infra/migrations/003_alert_events.sql

      - name: Tests
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          DATABASE_URL: postgresql://fx:fx@localhost:5432/fx
          # Turns "service unreachable" from a silent skip into a build failure.
          # Without it a broken service container reduces the suite to the unit
          # tier and the badge stays green over 53 tests that never ran.
          FX_REQUIRE_SERVICES: "1"
        run: uv run pytest tests -q --timeout=90 --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      # Typecheck first: it is the cheapest gate and its errors point at a line,
      # whereas a type error surfacing through a test failure points at a symptom.
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build

  demo:
    # The published link is the most-clicked thing in this repo and the easiest
    # to break silently, because docs/ is a committed artifact: nothing about
    # editing the source makes it fail, it just quietly stops matching. So
    # rebuild it, assert the committed copy is byte-identical, then load the
    # result under every path shape a host might serve it from — a subpath, a
    # domain root, a deep CDN path, the 404 fallback, and straight off disk.
    #
    # Four published demos in a row came up blank for path reasons that one
    # eyeballed URL could not have caught, because the same file is correct
    # under one prefix and broken under another.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Rebuild the published bundle
        # The build runs in a subshell so the next line still starts at the repo
        # root. Chaining `cd apps/web` then `cd ..` lands in apps/, not the root,
        # which is exactly how this shipped broken the first time.
        run: |
          (cd apps/web && VITE_DEMO=1 npm run build)
          node scripts/inline_demo.mjs

      - name: Committed copy is identical to the rebuild
        run: |
          git diff --exit-code --stat docs/ \
            || { echo "::error::docs/ is stale — run 'make demo' and commit the result"; exit 1; }

      - name: The published page actually comes up
        run: node scripts/verify_demo.mjs

  load:
    # Not a merge gate. The numbers behind docs/benchmarks.md need to execute
    # somewhere other than on demand, but a benchmark on a shared runner is too
    # noisy to block a pull request on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --all-packages --frozen
      - name: Benchmarks
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          FX_REQUIRE_SERVICES: "1"
        run: uv run pytest tests/load -m load -q -s --timeout=300

  compose:
    # Proves the claim on the README's first screen: `docker compose up` works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build --parallel
      - name: Boot the stack and assert it becomes ready
        run: |
          # `up -d` has its own failure mode: a dependency can exit during init,
          # and then compose reports only "container X exited (3)" — which names
          # the container and says nothing about why. The logs that would explain
          # it are printed on the readiness path below and nowhere else, so that
          # failure arrives with no diagnosis attached. Dump state on every exit.
          dump() { docker compose ps -a; docker compose logs --no-color --tail=200; }

          if ! docker compose up -d; then
            echo "::error::compose up failed before the stack was running"
            dump
            exit 1
          fi

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/readyz | grep -q '"ready":true'; then
              echo "stack ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::stack did not become ready"
          dump
          exit 1
      - if: always()
        run: docker compose down -v
