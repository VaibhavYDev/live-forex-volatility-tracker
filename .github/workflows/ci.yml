name: CI

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  schedule:
    # The load suite asserts the O(1) property, and an O(n) regression passes
    # every functional test while degrading only after hours of uptime. Nightly
    # rather than per-push because it takes minutes, not seconds.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      timescale:
        # Same pin as docker-compose.yml; see the note there.
        image: timescale/timescaledb:2.30.0-pg16
        env:
          POSTGRES_USER: fx
          POSTGRES_PASSWORD: fx
          POSTGRES_DB: fx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fx" --health-interval 5s
          --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true, python-version: "3.12"}
      # --locked, not --frozen: a lockfile that disagrees with pyproject.toml must
      # fail here, or the first `uv run` re-resolves it and tests something else.
      - run: uv sync --all-packages --locked

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check . --output-format=github
      - name: Types (strict)
        run: uv run mypy packages apps

      - name: Apply schema
        env: {PGPASSWORD: fx}
        run: |
          # The image tag is `latest-pg16`, a moving target — the extension version
          # underneath changes without a commit here, and its API has changed
          # across releases. Print what we actually got, so a migration that stops
          # applying can be read against a version instead of guessed at.
          psql -h localhost -U fx -d fx -tAc \
            "SELECT 'timescaledb ' || default_version FROM pg_available_extensions WHERE name = 'timescaledb'"
          psql -h localhost -U fx -d fx -v ON_ERROR_STOP=1 -f infra/migrations/001_init.sql
          psql -h localhost -U fx -d fx -v ON_ERROR_STOP=1 -f infra/migrations/003_alert_events.sql

      - name: Tests
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          DATABASE_URL: postgresql://fx:fx@localhost:5432/fx
          # Turns "service unreachable" from a silent skip into a build failure.
          # Without it a broken service container reduces the suite to the unit
          # tier and the badge stays green over 53 tests that never ran.
          FX_REQUIRE_SERVICES: "1"
        run: uv run pytest tests -q --timeout=90 --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      # Typecheck first: it is the cheapest gate and its errors point at a line,
      # whereas a type error surfacing through a test failure points at a symptom.
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build

  load:
    # Not a merge gate. The numbers behind docs/benchmarks.md need to execute
    # somewhere other than on demand, but a benchmark on a shared runner is too
    # noisy to block a pull request on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --all-packages --locked
      - name: Benchmarks
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          FX_REQUIRE_SERVICES: "1"
        run: uv run pytest tests/load -m load -q -s --timeout=300

  compose:
    # The stack as a user first runs it: no market-data credentials. Everything
    # builds and boots, the ingestor refuses to start rather than invent prices,
    # readiness says so, and the dashboard shows no data instead of made-up data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build --parallel
      - name: Boot without credentials and assert nothing is fabricated
        run: |
          # `up -d` can fail with only "container X exited (3)", which names the
          # container and says nothing about why. Dump state on any failure.
          dump() { docker compose ps -a; docker compose logs --no-color --tail=200; }
          trap '[ $? -eq 0 ] || dump' EXIT

          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz >/dev/null

          # No token, no feed: the ingestor exits with EX_CONFIG. There is no
          # simulator to fall back to.
          for i in $(seq 1 30); do
            docker compose logs ingestor 2>&1 | grep -q "FX_PROVIDER_TOKEN is required" && break
            sleep 1
          done
          docker compose logs ingestor 2>&1 | grep -q "FX_PROVIDER_TOKEN is required"

          code=$(curl -s -o readyz.json -w '%{http_code}' http://localhost:8000/readyz)
          cat readyz.json
          [ "$code" = 503 ] && grep -q '"ready":false' readyz.json

          node scripts/verify_app.mjs http://localhost:5173
      - if: always()
        run: docker compose down -v
